# Local development database: Postgres 16 with pgvector.
# Values come from .env (copy .env.example); the defaults match it.
name: sr-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sr_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-sr_agent}
    ports:
      - "127.0.0.1:${SR_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
