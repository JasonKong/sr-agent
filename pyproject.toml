[project]
name = "sr-agent-workspace"
version = "0.1.0"
description = "Workspace root for SR-Agent. See docs/DESIGN.md."
requires-python = ">=3.12"
dependencies = ["sr-db", "sr-simulator", "sr-mcp", "sr-agent", "sr-evals"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/db",
    "packages/simulator",
    "packages/mcp_server",
    "packages/agent",
    "packages/evals",
]

[tool.uv.sources]
sr-db = { workspace = true }
sr-simulator = { workspace = true }
sr-mcp = { workspace = true }
sr-agent = { workspace = true }
sr-evals = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["sr_db", "sr_simulator", "sr_mcp", "sr_agent", "sr_evals"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-m", "not live and not integration",
]
markers = [
    "live: calls a real model API; run with -m live",
    "integration: needs local services such as Postgres; run with -m integration",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
