[project]
name = "sr-mcp"
version = "0.1.0"
description = "Read-only, privacy-safe MCP server over the simulated referral systems."
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<2.4",
    "psycopg-pool>=3.2",
    "pydantic-settings>=2.15.0",
    "sr-db",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
sr-mcp = "sr_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
sr-db = { workspace = true }
