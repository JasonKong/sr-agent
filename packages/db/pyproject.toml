[project]
name = "sr-db"
version = "0.1.0"
description = "Shared database settings, migration runner and SQL migrations for SR-Agent."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
sr-db = "sr_db.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.14.0"]
build-backend = "uv_build"
