title: Hand-off failed once, then the resend worked
cs_hears: "Was it stuck? The GP saw an error earlier."
trap: >
  The first hand-off to the Hub returned a server error, and Composer logged
  HUB_SEND_FAILED, like F04. The automatic resend about an hour later succeeded and the
  referral went through normally.
params:
