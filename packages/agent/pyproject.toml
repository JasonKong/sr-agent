[project]
name = "sr-agent"
version = "0.1.0"
description = "Diagnosis agent that explains why a referral failed, with evidence."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11,<2",
    "httpx2>=2.13",
    "mcp>=2.3,<2.4",
    "pydantic-settings>=2.15.0",
    "sr-db",
]

[project.scripts]
sra = "sr_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
sr-db = { workspace = true }
