name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repository. No secrets are used, so pull
# requests from forks run safely.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail if uv.lock is out of date with the pyproject.toml files.
  UV_LOCKED: "1"

jobs:
  check:
    name: Lint, type check, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a commit SHA; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - run: make check

  integration:
    name: Integration tests (Postgres + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sr
          POSTGRES_PASSWORD: sr_ci_only
          POSTGRES_DB: sr_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sr -d sr_agent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://sr:sr_ci_only@localhost:5432/sr_agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - run: make migrate
      - run: make test-integration
