version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  # Python dependencies across the uv workspace (uv.lock at the root).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The web console (packages/web, pnpm). A TypeScript major is a deliberate upgrade:
  # typescript-eslint and openapi-typescript lag behind it (DESIGN.md section 7.6).
  - package-ecosystem: npm
    directory: /packages/web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
